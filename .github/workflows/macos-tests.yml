name: macOS tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test click policy
        run: |
          xcodebuild -quiet \
            -project ClickThrough.xcodeproj \
            -scheme ClickThrough \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build universal release
        run: ./scripts/build-release.sh
      - name: Package installable DMG
        run: ./scripts/make-dmg.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClickThrough-macOS-universal
          path: build/ClickThrough.dmg
          if-no-files-found: error
          retention-days: 30
